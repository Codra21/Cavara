# Deploys the production Worker (cavara-web → cavarabd.com) on every push to main.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token on Hridoyn02's Cloudflare account: "Edit Cloudflare Workers" template plus D1 Edit
#   CLOUDFLARE_ACCOUNT_ID  7b55798e5a2b91035dece6c8411564e4
#
# Order: checks and build → database release → deploy → smoke test. Nothing touches production unless every check
# passes. The database release (scripts/db/migrate-prod.ts) is a no-op when cavara-prod is up to date; otherwise it
# requires the migrations to be on cavara-dev already, records a Time Travel bookmark, stores a SQL export in R2
# (cavara-backups), then migrates. Migrations must work with the code already live (it is replaced moments later).
# Docs: https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/,
#       https://developers.cloudflare.com/d1/reference/time-travel/

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # package.json "packageManager": "bun@1.4.4", the same Bun as local development (.mise.toml).
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run check

      - name: Format check
        run: bun run format:check

      - name: Build for production
        run: bun run build:prod

      - name: Back up and migrate cavara-prod (if needed)
        run: bun run db:release:prod

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uses the project's own wrangler (node_modules). The production build already wrote the flattened
          # production config (dist/server/wrangler.json), which plain `wrangler deploy` picks up.
          packageManager: bun
          command: deploy

      - name: Smoke test cavarabd.com
        run: |
          # Stable pages only: product URLs can change from the admin.
          for path in / /robots.txt; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "https://cavarabd.com$path")"
            echo "$path → $code"
            test "$code" = "200"
          done
